<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="narraBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E261A"/>
      <stop offset="100%" stop-color="#2C1E16"/>
    </linearGradient>
  </defs>
  <!-- Warm Narra Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#narraBg)"/>
  <!-- Subtle Outer Gold Rim (keeps crisp edge in dark tabs) -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="12.25" fill="none" stroke="#D4A359" stroke-opacity="0.48" stroke-width="1.5"/>
  <!-- Heritage Crimson-Gold Inner Frame -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="9" fill="none" stroke="#A63222" stroke-opacity="0.72" stroke-width="1.2"/>
  <rect x="8.5" y="8.5" width="47" height="47" rx="7.2" fill="none" stroke="#D4A359" stroke-opacity="0.58" stroke-width="0.9"/>
  <!-- Tiny Woven Heritage Diamond Accents (top & bottom center) -->
  <polygon points="32,5 34.4,7.4 32,9.8 29.6,7.4" fill="#D4A359"/>
  <polygon points="32,54.2 34.4,56.6 32,59 29.6,56.6" fill="#D4A359"/>
  <!-- Centered Classic Serif LF Monogram -->
  <text
    x="32"
    y="42.5"
    text-anchor="middle"
    fill="#FAF6F0"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="31"
    letter-spacing="-1.2"
  >LF</text>
</svg>
